name: travel_sos_mesh
description: "Travel SOS Mesh — Late-Night Journey Safety Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Persistence
  shared_preferences: ^2.3.5

  # Hardware Permissions & Device Status
  permission_handler: ^11.4.0
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.3

  # Sensors & Telemetry
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2

  # Tactical Map (OpenStreetMap & Offline Canvas Fallback)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Network & Utilities
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
